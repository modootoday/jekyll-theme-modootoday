# The component order (adr:modootoday/20261114090712): purpose groups in this order, A-Z by English title inside
# each, the same in every language. Keys are the modootoday.components names, plus the docs topics typography, icons,
# language-switcher and posts; a title is the heading of the component's first section on the components page.
- id: text
  title: {en: Text and inline, ko: 텍스트와 인라인, ja: テキストとインライン}
  components: {badge: Badges, footnotes: Footnotes, anchor: Heading anchors, kbd: Keyboard keys, lists: Lists, loading: Loading and skeletons, progress: Progress, typography: Typography}
- id: blocks
  title: {en: Blocks, ko: 블록, ja: ブロック}
  components: {callout: Alerts, code: Code blocks, code-copy: Copy button, filetree: File tree, quote: Quote, terminal: Terminal}
- id: media
  title: {en: Media, ko: 미디어, ja: メディア}
  components: {diagram: Diagrams, embed: Embeds, figure: Figure, gallery: Gallery, figure-svg: SVG figure, visual: Visual, widget: Widget}
- id: data
  title: {en: Data, ko: 데이터, ja: データ}
  components: {chart: Chart, filter: Filter, params: Parameter table, table-stack: Stacked tables, table: Tables}
- id: disclosure
  title: {en: Disclosure and sequence, ko: 펼침과 순서, ja: 開閉と順序}
  components: {accordion: Accordion, details: Details, faq: FAQ, steps: Steps, tabs: Tabs, timeline: Timeline}
- id: sections
  title: {en: Page sections, ko: 페이지 섹션, ja: ページセクション}
  components: {cta: Buttons, card: Cards, bleed: Full-bleed band, hero: Hero, install: Install, linkcards: Link cards, pricing: Pricing, reveal: Reveal on scroll, split: Split, subscribe: Subscribe}
- id: chrome
  title: {en: Site chrome, ko: 사이트 공통 요소, ja: サイト共通要素}
  components: {banner: Banner, breadcrumb: Breadcrumb and table of contents, footer: Footer, icons: Icons and logo, language-switcher: Language switcher, nav: Navigation, page-actions: Page actions, posts: Posts and archives, pagination: Previous and next, search: Search, showcase: Showcase, sidebar: Sidebar, toc: Table of contents, theme-toggle: Theme toggle}
