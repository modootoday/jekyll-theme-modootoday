title: modoo.today theme
description: A Jekyll theme for plain-Markdown docs that read well on GitHub, on GitHub Pages and for AI agents.
lang: en
url: https://modootoday.github.io
baseurl: /jekyll-theme-modootoday
# Dogfooding: GitHub Pages (classic, main /docs) builds this site with the theme from this repo.
# Pinned to main until the first release; switch to @vX.Y.Z when a tag is published.
remote_theme: modootoday/jekyll-theme-modootoday@main
plugins: [jekyll-remote-theme, jekyll-optional-front-matter, jekyll-titles-from-headings, jekyll-sitemap]
markdown: kramdown
kramdown: {input: GFM, syntax_highlighter: rouge}
sass: {style: compressed, silence_deprecations: [import]}
permalink: pretty
exclude: [Gemfile, Gemfile.lock, README.md, vendor]
modootoday:
  lists: {link_chips: true, titled_items: true}
  og_image: /assets/images/site/og.jpg
  nav: main
  # Front-matter-less pages are their own twins; other pages keep stubs.
  twins: source
  # Order and names: docs/_data/languages.yml. A language is listed once its home page is localized
  # (index.<code>.md, or home/index.<code>.md for a language that translates only the home page).
  languages: [en, zh-CN, zh-TW, ja, ko, tr, ru, vi, th, de, es, fr, uk, pl, pt-BR, ar, fa, id, it, el, ml, ur-Latn, ro]
  # Translate every page (beside their sources, x.ko.md); modootoday-check --i18n-pages lists the gaps.
  full_languages: [ko, ja]
  language_switcher: header
  logo: brand
  favicon: brand
  # No inline script, so the docs QA can serve every page under a strict CSP header (test/system/audit/csp.mjs).
  csp: strict
  edit_url: https://github.com/modootoday/jekyll-theme-modootoday/edit/main/docs/
  # Post footers link tags and categories here (/ko/tags/ for lang: ko posts).
  archive: {tags: /tags/, categories: /categories/}
  # demo only: the subscribe form on the components pages submits back to the components page instead of a mail service
  subscribe: {action: https://modootoday.github.io/jekyll-theme-modootoday/components/, method: get}
  # demo only: the hero module of the script visual demo page (layouts/demo/orbit)
  scripts:
    orbit: {src: /assets/js/hero/orbit.js, css: /assets/css/orbit.css}
  # demo only: one page per record of _data/plugins.json (recipes/records), written by modootoday-stubs docs --records --write
  records:
    plugins: {dir: recipes/records, title: name, description: summary, facts: [category, version, tags], body: readme}
defaults:
  - {scope: {path: ""}, values: {layout: doc}}
  - {scope: {type: posts}, values: {layout: post}}
