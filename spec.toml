# specfold configuration. Run `spec explain config` for every key.
[spec]
schema = 1

[owners]
root = "modootoday"

# Plain markdown outside documents whose <!-- spec:count --> markers N1 keeps current.
# [check]
# count_paths = ["README.md", "docs/**/*.md"]

# Public-safe docs are committed in .spec/ (not shipped: gemspec files is a whitelist).
# Research, plans, drafts and anything internal stay in .spec.local/ (git-ignored).
[local]
path = ".spec.local"

# Site sources are published; they must hold no spec document (V1).
[public]
paths = ["example", "docs"]
detect = ["pages", "site-generators"]

# Cheap public-surface guard: secrets and box-local paths in committed docs.
[[guards]]
name = "public-surface"
paths = [".spec/**"]
secrets = true
deny_regex = ['/workspace/', '/home/box', '\.spec\.local/']
