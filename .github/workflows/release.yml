# Publishes the gem to RubyGems with trusted publishing (OIDC), no API key.
# https://guides.rubygems.org/trusted-publishing/
# Requires a (pending) trusted publisher on rubygems.org for this repository,
# workflow "release.yml" and environment "rubygems".
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-24.04
    environment: rubygems
    permissions:
      contents: write   # release-gem pushes the tag; the last step creates the GitHub Release
      id-token: write   # OIDC token for RubyGems trusted publishing
      actions: read     # the release check runs on the tagged commit
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # RELEASING.md step 3: the manual ci, lighthouse and visual runs on this commit all succeeded. The repository
      # variable RELEASE_CHECKS_OVERRIDE set to this tag skips it once (RELEASING.md, "Overriding the release check").
      - name: Release check succeeded on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ vars.RELEASE_CHECKS_OVERRIDE }}
        run: |
          if [ "$OVERRIDE" = "$GITHUB_REF_NAME" ]; then
            ruby script/release-status "$GITHUB_SHA" || true
            echo "::warning::release check overridden for $GITHUB_REF_NAME by RELEASE_CHECKS_OVERRIDE"
            exit 0
          fi
          ruby script/release-status "$GITHUB_SHA" --verify
      - name: Test, then build and check the starter sites
        run: bundle exec rake
      - name: Check tag matches gem version
        run: |
          v=$(ruby -e 'puts Gem::Specification.load("jekyll-theme-modootoday.gemspec").version')
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != gem version $v"; exit 1; }
      # A first push that creates the gem must name the RubyGems account that owns the
      # pending trusted publisher. release-gem has no `owner` input, so exchange the
      # OIDC token here and let release-gem skip its own exchange.
      # 255203 is the account's immutable ID, shown on its Pending Trusted Publishers page.
      - name: Exchange OIDC token for a RubyGems API key
        env:
          RUBYGEMS_OWNER: "255203"
        run: |
          jwt=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | ruby -rjson -e 'puts JSON.parse($stdin.read)["value"]')
          echo "::add-mask::$jwt"
          key=$(curl -fsS -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H "Content-Type: application/json" \
            -d "{\"jwt\":\"$jwt\",\"owner\":\"$RUBYGEMS_OWNER\"}" | ruby -rjson -e 'puts JSON.parse($stdin.read)["rubygems_api_key"]')
          echo "::add-mask::$key"
          echo "RUBYGEMS_API_KEY=$key" >> "$GITHUB_ENV"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
          echo "BUNDLE_GEM__PUSH_KEY=$key" >> "$GITHUB_ENV"
      - uses: rubygems/release-gem@v1
        with:
          setup-trusted-publisher: "false"
      # After the gem is on RubyGems: a GitHub Release for the tag, with its CHANGELOG entry as the notes.
      # Skipped when the Release already exists, so a re-run does nothing.
      - name: Create the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping"; exit 0
          fi
          ruby script/release-notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
