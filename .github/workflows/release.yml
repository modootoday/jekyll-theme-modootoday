# Publishes the gem to RubyGems with trusted publishing (OIDC), no API key.
# https://guides.rubygems.org/trusted-publishing/
# Requires a (pending) trusted publisher on rubygems.org for this repository,
# workflow "release.yml" and environment "rubygems".
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-24.04
    environment: rubygems
    permissions:
      contents: write   # release-gem pushes the tag / creates the release metadata
      id-token: write   # OIDC token for RubyGems trusted publishing
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Test and build example
        run: bundle exec rake
      - name: Check tag matches gem version
        run: |
          v=$(ruby -e 'puts Gem::Specification.load("jekyll-theme-modootoday.gemspec").version')
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != gem version $v"; exit 1; }
      # A first push that creates the gem must name the RubyGems account that owns the
      # pending trusted publisher. release-gem has no `owner` input, so exchange the
      # OIDC token here and let release-gem skip its own exchange.
      # 255203 is the account's immutable ID, shown on its Pending Trusted Publishers page.
      - name: Exchange OIDC token for a RubyGems API key
        env:
          RUBYGEMS_OWNER: "255203"
        run: |
          jwt=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | ruby -rjson -e 'puts JSON.parse($stdin.read)["value"]')
          echo "::add-mask::$jwt"
          key=$(curl -fsS -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H "Content-Type: application/json" \
            -d "{\"jwt\":\"$jwt\",\"owner\":\"$RUBYGEMS_OWNER\"}" | ruby -rjson -e 'puts JSON.parse($stdin.read)["rubygems_api_key"]')
          echo "::add-mask::$key"
          echo "RUBYGEMS_API_KEY=$key" >> "$GITHUB_ENV"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
          echo "BUNDLE_GEM__PUSH_KEY=$key" >> "$GITHUB_ENV"
      - uses: rubygems/release-gem@v1
        with:
          setup-trusted-publisher: "false"
