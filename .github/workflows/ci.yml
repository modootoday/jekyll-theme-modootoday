name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruby:
    name: ${{ matrix.stack }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: github-pages
            ruby: "3.3"
            check_flags: --twins --github-pages
          - stack: jekyll4
            ruby: "3.3"
            check_flags: --twins
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.stack }}.gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Ruby tests
        run: bundle exec rake test
      - name: Build example
        run: bundle exec jekyll build -s example -d example/_site
      - name: Check example
        run: bundle exec ruby exe/modootoday-check example example/_site ${{ matrix.check_flags }}
      - name: Build example with remote_theme (this commit)
        if: matrix.stack == 'github-pages'
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf 'theme: null\nremote_theme: %s@%s\nplugins: [jekyll-remote-theme]\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/remote.yml"
          bundle exec jekyll build -s example -d "$RUNNER_TEMP/remote-site" --config "example/_config.yml,$RUNNER_TEMP/remote.yml"
          bundle exec ruby exe/modootoday-check example "$RUNNER_TEMP/remote-site" --twins --github-pages
          diff -r -x '*.css' example/_site "$RUNNER_TEMP/remote-site"
      - name: Build gem
        run: gem build jekyll-theme-modootoday.gemspec

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
