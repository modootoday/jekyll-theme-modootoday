name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruby:
    name: ${{ matrix.stack }} (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub Pages production (pages.github.com/versions.json): Ruby 3.3.4 + github-pages 232
          - stack: github-pages
            ruby: "3.3.4"
            check_flags: --twins --github-pages
          # Jekyll 4: oldest supported Ruby (gemspec required_ruby_version) and latest
          - stack: jekyll4
            ruby: "3.2"
            check_flags: --twins
          - stack: jekyll4
            ruby: "3.4"
            check_flags: --twins
          # gemspec floor: jekyll >= 3.9 without the github-pages gem
          - stack: jekyll39
            ruby: "3.2"
            check_flags: --twins
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.stack }}.gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: i18n catalogs in sync
        run: ruby script/i18n-build --check
      - name: Ruby tests
        run: bundle exec rake test
      - name: Build example
        run: bundle exec jekyll build -s example -d example/_site
      - name: Check example
        run: bundle exec ruby exe/modootoday-check example example/_site ${{ matrix.check_flags }}
      - name: Structured data on the example (url overlay)
        run: |
          printf 'url: https://example.com\n' > "$RUNNER_TEMP/url.yml"
          bundle exec jekyll build -s example -d "$RUNNER_TEMP/ld-site" --config "example/_config.yml,$RUNNER_TEMP/url.yml"
          bundle exec ruby exe/modootoday-check example "$RUNNER_TEMP/ld-site"
      - name: Build example with remote_theme (this commit)
        if: matrix.stack == 'github-pages'
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf 'theme: null\nremote_theme: %s@%s\nplugins: [jekyll-remote-theme]\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/remote.yml"
          bundle exec jekyll build -s example -d "$RUNNER_TEMP/remote-site" --config "example/_config.yml,$RUNNER_TEMP/remote.yml"
          bundle exec ruby exe/modootoday-check example "$RUNNER_TEMP/remote-site" --twins --github-pages
          diff -r -x '*.css' example/_site "$RUNNER_TEMP/remote-site"
      - name: Build gem
        run: gem build jekyll-theme-modootoday.gemspec

  # The real GitHub Pages builder (same image as Pages deployments) on a remote_theme: site
  # pinned to this commit, then the checker on its output.
  pages-action:
    name: actions/jekyll-build-pages (remote_theme)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Make remote_theme site from example
        run: |
          mkdir -p /tmp/rt && cp -r example/. /tmp/rt/ && rm -f /tmp/rt/Gemfile
          sed -i '/^theme:/d;/^remote_theme:/d' /tmp/rt/_config.yml
          printf '\nremote_theme: %s@%s\nplugins: [jekyll-remote-theme]\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> /tmp/rt/_config.yml
          rm -rf rt-src && mv /tmp/rt rt-src
      - uses: actions/jekyll-build-pages@v1
        with:
          source: rt-src
          destination: rt-site
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
      - name: Check output
        run: ruby exe/modootoday-check rt-src rt-site --twins

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  tokens:
    name: DTCG tokens.json (read-only artifact)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
      - run: ruby script/tokens-json tokens.json && ruby -rjson -e 'JSON.parse(File.read("tokens.json"))'
      - uses: actions/upload-artifact@v7
        with:
          name: tokens-json
          path: tokens.json
          if-no-files-found: error

  docs-qa:
    name: docs site QA
    runs-on: ubuntu-24.04
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/github-pages.gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build docs/ with this checkout's theme (github-pages 232)
        run: qa/site/build-docs.sh docs/_site
      - name: Check docs/
        run: bundle exec ruby exe/modootoday-check docs docs/_site --twins
      - name: Internal links and anchors (external links are not fetched)
        run: bundle exec ruby qa/docs/links.rb docs/_site /jekyll-theme-modootoday
      - name: Kitchen-sink coverage
        run: ruby qa/docs/coverage.rb
      - name: Docs structure (sections, front matter, generated nav and twins, size limits)
        run: ruby qa/docs/structure.rb
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Screenshots, axe, contrast, budgets
        run: npm run qa
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-qa
          path: qa-out
          retention-days: 14
