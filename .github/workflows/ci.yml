name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run moot. A manual run (the release check) has its own group per ref:
# pushes never cancel it, and a second manual run waits for the first instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  ruby:
    name: ${{ matrix.stack }} (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04
    # Ruby 4.0 runs as an allowed-failure entry (not yet verified outside CI)
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub Pages production (pages.github.com/versions.json): Ruby 3.3.4 + github-pages 232
          # starters: build the starter sites here too; starters.yml covers github-pages 232 and Jekyll 4 on Ruby 3.3.
          - stack: github-pages
            ruby: "3.3.4"
          # Jekyll 4: oldest supported Ruby (gemspec required_ruby_version) and latest
          - stack: jekyll4
            ruby: "3.3"
          - stack: jekyll4
            ruby: "3.4"
            starters: true
          - stack: jekyll4
            ruby: "4.0"
            starters: true
            experimental: true
          # gemspec floor: jekyll >= 3.9 without the github-pages gem
          - stack: jekyll39
            ruby: "3.3"
            starters: true
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.stack }}.gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
          # Release tags let test/project/changelog_test.rb compare each released entry with its tag.
          fetch-tags: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: i18n catalogs in sync
        run: ruby script/i18n-build --check
      - name: Ruby tests
        run: bundle exec rake test
      - name: Build and check the starter sites
        if: matrix.starters == true
        run: bundle exec rake starters:build
      - name: Build gem
        run: gem build jekyll-theme-modootoday.gemspec

  # 250 and 1,000 record pages (test/system/bench/records.rb) built by the Pages builder image; fails over 300 s, half the Pages limit.
  records-bench:
    name: records benchmark (github-pages 232)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
      - name: Build 250 and 1,000 records (times in the job summary)
        run: ruby test/system/bench/records.rb --records 250,1000 --limit 300 --work "$RUNNER_TEMP/bench"

  # The commit rules the generated CHANGELOG relies on, over the pushed range or the pull request's commits.
  commits:
    name: commit messages
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the commit messages
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then range="$BASE..$HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then range="-1 $HEAD"
          else range="$BEFORE..$HEAD"; fi
          ruby script/commit-check $range

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # git-cliff reads the commits and tags since the last release.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The pinned git-cliff is in node_modules here; the Ruby jobs skip this comparison without it.
      - name: CHANGELOG [Unreleased] is generated from the commits
        run: ruby script/changelog --check

  tokens:
    name: DTCG tokens.json (read-only artifact)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
      - run: ruby script/tokens-json tokens.json && ruby -rjson -e 'JSON.parse(File.read("tokens.json"))'
      - uses: actions/upload-artifact@v7
        with:
          name: tokens-json
          path: tokens.json
          if-no-files-found: error

  docs-qa:
    name: docs site QA
    # About ten minutes of browser checks: pull requests and the manual release check only.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/github-pages.gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build docs/ with this checkout's theme (github-pages 232)
        run: test/system/site/build-docs.sh docs/_site
      - name: Check docs/
        run: bundle exec ruby exe/modootoday-check docs docs/_site --twins
      - name: Internal links and anchors (external links are not fetched)
        run: bundle exec ruby test/system/docs/links.rb docs/_site /jekyll-theme-modootoday
      # The source half and the docs structure also run in rake test (test/project/docs_checks_test.rb) on every push.
      - name: Kitchen-sink coverage, with the built example pages
        run: ruby test/system/docs/coverage.rb
      - name: Component examples in the built HTML (leaked source, empty or hidden source, front matter, list forms)
        run: bundle exec ruby test/system/docs/examples.rb docs/_site
      # The PWA flows of npm run qa serve these: v1, v2, next and kill at /a, v1 at /b and at the origin root.
      - name: Build the PWA fixture site six times
        run: test/system/site/build-pwa.sh
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Screenshots, axe, contrast, budgets, CSP, PWA flows
        run: npm run qa
      # WebKit is a smoke test of offline reading only: registration, a kept page and the offline page.
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: PWA offline smoke (WebKit)
        run: node test/system/audit/features/pwa.mjs pkg/pwa --browser=webkit --only=offline --smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-qa
          path: qa-out
          retention-days: 14
