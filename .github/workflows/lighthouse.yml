name: Lighthouse

# Lighthouse budget for the docs site: each page runs 3 times per form factor and the median
# score is checked against test/system/lighthouse/budget.json. Accessibility, best practices and SEO are
# pinned at 100; performance has a stable floor (runner load moves it by a few points).

# Pull requests and manual runs only (the release check); pushes to main skip it to keep CI short.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse budget (median of 3)
    runs-on: ubuntu-24.04
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/github-pages.gemfile
      RUNS: "3"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build docs/ with this checkout's theme
        run: test/system/site/build-docs.sh docs/_site
      - name: Run Lighthouse
        run: CHROME_PATH="$(command -v google-chrome)" test/system/lighthouse/lighthouse.sh docs/_site qa-out/lighthouse
      - name: Check budget
        run: node test/system/lighthouse/budget.mjs qa-out/lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: qa-out/lighthouse
          retention-days: 14
