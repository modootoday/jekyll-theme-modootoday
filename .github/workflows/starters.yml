name: Starters

# Renders every starter of example/starters.yml (rake starters:render), fails on drift (a published starter, a gitlink,
# against a render of its content at the release it pins), then builds and checks each one on both stacks: the
# github-pages 232 bundle and Jekyll 4, and the real GitHub Pages builder on remote_theme; then builds each live demo with
# its _config.demo.yml and runs the starter audit on it. Visual and Lighthouse runs of the demos are in visual.yml and
# lighthouse.yml, with the docs ones.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push cancels the older run on its ref; a manual run has its own queue per ref, which pushes never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.starter }} (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        starter: [docs, blog, landing]
        stack: [github-pages, jekyll4]
        include:
          # GitHub Pages production (pages.github.com/versions.json): Ruby 3.3.4 + github-pages 232
          - stack: github-pages
            ruby: "3.3.4"
          - stack: jekyll4
            ruby: "3.3"
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.stack }}.gemfile
      GEM_TREE: pkg/starters/jekyll4/${{ matrix.starter }}
      CLASSIC_TREE: pkg/starters/github-pages/${{ matrix.starter }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Render, then check for drift
        run: bundle exec rake starters:render starters:check
      - name: Build and check with the manifest flags
        run: bundle exec rake "starters:build[${{ matrix.starter }}]"
      # The live demo's build: _config.demo.yml layered, at the repository's Pages base path, with its qa: pages.
      - name: Demo build (showcase overlay)
        run: bundle exec rake "starters:demo[${{ matrix.starter }},$RUNNER_TEMP/demo]"
      - name: Structured data (url overlay)
        run: |
          printf 'url: https://example.com\n' > "$RUNNER_TEMP/url.yml"
          bundle exec jekyll build -s "$GEM_TREE" -d "$RUNNER_TEMP/ld-site" --config "$GEM_TREE/_config.yml,$RUNNER_TEMP/url.yml"
          bundle exec ruby exe/modootoday-check "$GEM_TREE" "$RUNNER_TEMP/ld-site"
      # The classic tree as rendered, its remote_theme pointed at this commit: same output as the gem build but CSS.
      - name: remote_theme at this commit
        if: matrix.stack == 'github-pages'
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          flags=$(sed -n 's/^ *modootoday-check \. _site //p' "$CLASSIC_TREE/.github/workflows/pages.yml")
          printf 'remote_theme: %s@%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/remote.yml"
          bundle exec jekyll build -s "$GEM_TREE" -d "$RUNNER_TEMP/gem-site"
          bundle exec jekyll build -s "$CLASSIC_TREE" -d "$RUNNER_TEMP/remote-site" --config "$CLASSIC_TREE/_config.yml,$RUNNER_TEMP/remote.yml"
          bundle exec ruby exe/modootoday-check "$CLASSIC_TREE" "$RUNNER_TEMP/remote-site" $flags --github-pages
          diff -r -x '*.css' "$RUNNER_TEMP/gem-site" "$RUNNER_TEMP/remote-site"
      # Plain Jekyll shapes on remote_theme at this commit: a `jekyll new` site and layouts in subfolders
      # (test/consumer/minima_shaped_test.rb and test/layouts/families/nested_layout_test.rb run them on the gem).
      - name: Plain Jekyll fixtures on remote_theme
        if: matrix.stack == 'github-pages' && matrix.starter == 'docs'
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf 'theme: null\nremote_theme: %s@%s\nplugins: [jekyll-remote-theme, jekyll-feed]\nauthor: {name: Jane Doe}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/plain.yml"
          for f in minima-shaped nested-layouts; do
            bundle exec jekyll build -s "test/fixtures/sites/$f" -d "$RUNNER_TEMP/$f" --config "test/fixtures/sites/$f/_config.yml,$RUNNER_TEMP/plain.yml" 2>&1 | tee "$RUNNER_TEMP/$f.log"
            if grep -q 'does not exist' "$RUNNER_TEMP/$f.log"; then exit 1; fi
            bundle exec ruby exe/modootoday-check "test/fixtures/sites/$f" "$RUNNER_TEMP/$f"
          done
          grep -q 'href="/about/"' "$RUNNER_TEMP/minima-shaped/index.html"
          grep -q 'mt-home-posts' "$RUNNER_TEMP/minima-shaped/index.html"
          grep -q 'mt-post-author">Jane Doe' "$RUNNER_TEMP"/minima-shaped/jekyll/update/2026/01/05/welcome-to-jekyll.html
          grep -q 'data-fixture-layout="endpoint" data-fixture-page="docs/endpoint"' "$RUNNER_TEMP/nested-layouts/api/get-user/index.html"
          grep -q 'data-fixture-layout="lesson" data-fixture-page="learn/lesson"' "$RUNNER_TEMP/nested-layouts/learn/first/index.html"

  # The real GitHub Pages builder (the image Pages deployments use) on each classic tree, remote_theme pinned to this
  # commit and both URL aliases on, with the stubs modootoday-stubs writes; then the checker on its output.
  pages-action:
    name: ${{ matrix.starter }} (actions/jekyll-build-pages)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        starter: [docs, blog, landing]
    env:
      CLASSIC_TREE: pkg/starters/github-pages/${{ matrix.starter }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
      - name: Classic tree at this commit, URL aliases on
        run: |
          rake starters:render
          ruby -ryaml -e 'f = ARGV[0]; c = YAML.load_file(f); c["remote_theme"] = ARGV[1]; (c["modootoday"] ||= {})["aliases"] = {"md" => true, "html" => true}; File.write(f, YAML.dump(c))' \
            "$CLASSIC_TREE/_config.yml" "$GITHUB_REPOSITORY@$GITHUB_SHA"
          kinds="$(sed -n 's/^bundle exec modootoday-stubs \. \(.*\) --write$/\1/p' "$CLASSIC_TREE/README.md") --aliases"
          ruby exe/modootoday-stubs "$CLASSIC_TREE" $kinds --write
          ruby exe/modootoday-stubs "$CLASSIC_TREE" $kinds --check
          # remote_theme ignores the Gemfile; left in, the builder warns that the github-pages gem cannot satisfy it.
          rm -f "$CLASSIC_TREE/Gemfile" "$CLASSIC_TREE/Gemfile.lock"
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ${{ env.CLASSIC_TREE }}
          destination: rt-site
      - name: Check output
        run: |
          flags=$(sed -n 's/^ *modootoday-check \. _site //p' "$CLASSIC_TREE/.github/workflows/pages.yml")
          ruby exe/modootoday-check "$CLASSIC_TREE" rt-site $flags --aliases

  # Each live demo as its repository deploys it (_config.demo.yml layered, github-pages 232) in a browser: the showcase
  # audit (test/system/audit/features/showcase.mjs) on the first two qa: pages of the manifest, then the page, budget and
  # CSP checks that moved into the starters (test/system/audit/config.mjs STARTERS) on every qa: page.
  showcase:
    name: ${{ matrix.starter }} demo audit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        starter: [docs, blog, landing]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/github-pages.gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Demo build
        run: bundle exec rake "starters:demo[${{ matrix.starter }},$RUNNER_TEMP/demo]"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Starter audit
        run: node test/system/starters.mjs "$RUNNER_TEMP/demo" "qa-out/starters-${{ matrix.starter }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: starters-${{ matrix.starter }}
          path: qa-out
          retention-days: 14
