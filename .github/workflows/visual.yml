name: Visual regression

# Report-only: screenshots the docs/ site built from the base commit and from this commit on the
# same runner, then compares them pixel by pixel. Both sides use the same OS image and fonts, so
# platform font differences cannot cause false diffs. It never fails the build; differences are
# listed in the job summary and the diff images are uploaded as the "visual" artifact.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  visual:
    name: docs screenshots vs base
    runs-on: ubuntu-24.04
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/github-pages.gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build docs/ at the base commit
        id: base
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || ! git cat-file -e "$BASE_SHA:qa/build-docs.sh" 2>/dev/null; then
            echo "No usable base commit; skipping the comparison." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git worktree add -q "$RUNNER_TEMP/base" "$BASE_SHA"
          export BUNDLE_GEMFILE="$RUNNER_TEMP/base/gemfiles/github-pages.gemfile"
          bundle install --quiet
          (cd "$RUNNER_TEMP/base" && qa/build-docs.sh "$RUNNER_TEMP/base-site")
      - name: Baseline from the base commit
        if: steps.base.outputs.skip != 'true'
        run: node qa/visual.mjs "$RUNNER_TEMP/base-site" --update --baseline qa-out/visual/baseline
      - name: Build docs/ at this commit
        if: steps.base.outputs.skip != 'true'
        run: qa/build-docs.sh docs/_site
      - name: Compare (report only)
        if: steps.base.outputs.skip != 'true'
        run: node qa/visual.mjs docs/_site --baseline qa-out/visual/baseline --out qa-out/visual/changed --report
      - uses: actions/upload-artifact@v7
        if: steps.base.outputs.skip != 'true'
        with:
          name: visual
          path: qa-out/visual
          retention-days: 14
          if-no-files-found: ignore
