name: Dependabot merge

# Dependabot's pull requests are the one pull request flow this repository keeps (adr:modootoday/20261109225836).
# Each one is squash-merged by this workflow once every workflow run on its head commit has succeeded. It needs no
# repository setting and no branch rule, so direct pushes to main stay as they are.
on:
  workflow_run:
    workflows: [CI, Starters]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.repository == 'modootoday/jekyll-theme-modootoday' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Squash-merge when every run on the head commit has succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number,author,headRefOid \
            -q ".[] | select(.author.login == \"app/dependabot\" and .headRefOid == \"$SHA\") | .number")
          if [ -z "$pr" ]; then echo "no open Dependabot pull request at $SHA"; exit 0; fi
          runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" -q '.workflow_runs[] | "\(.name) \(.status) \(.conclusion)"')
          echo "$runs"
          if echo "$runs" | grep -Evq ' completed (success|skipped)$'; then echo "not every run on $SHA has succeeded yet"; exit 0; fi
          gh pr merge -R "$REPO" "$pr" --squash --match-head-commit "$SHA" || echo "already merged or changed since $SHA"
