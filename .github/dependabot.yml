version: 2
# Pull requests are merged once every run on their head commit succeeds (workflows/dependabot-auto-merge.yml); the
# build(deps) prefix keeps their squash commits Conventional, and the generated CHANGELOG leaves them out.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: build, include: scope}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: bundler
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: build, include: scope}
    # gemfiles/github-pages.gemfile pins the GitHub Pages production set on purpose
    ignore:
      - dependency-name: github-pages
      - dependency-name: nokogiri
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: build, include: scope}
    groups: {dev: {patterns: ["*"]}}
