title: Example Docs
description: A neutral example site for jekyll-theme-modootoday.
lang: en
theme: jekyll-theme-modootoday
# GitHub Pages without a Gemfile: replace the line above with
# remote_theme: modootoday/jekyll-theme-modootoday@v1.0.0   (and add jekyll-remote-theme to plugins)
markdown: kramdown
sass: {silence_deprecations: [import, global-builtin]}  # Dart Sass (Jekyll 4); ignored by GitHub Pages
kramdown: {input: GFM, syntax_highlighter: rouge}
permalink: pretty
# Logo and favicon from the modootoday mark (or a path to your own image): modootoday: {logo: brand, favicon: brand}
exclude: [Gemfile, Gemfile.lock, README.md, source-mode]
defaults:
  - {scope: {path: ""}, values: {layout: doc}}
  - {scope: {path: "", type: posts}, values: {layout: post}}
  - {scope: {path: "ko"}, values: {lang: ko}}
  - {scope: {path: "ja"}, values: {lang: ja}}
