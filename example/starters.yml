# The starter sites. Each one is the folder of the same name beside this file and builds on its own.
# `rake starters:render` writes each starter for each stack to pkg/starters/<stack>/<name>/, adding what the theme
# owns: the remote_theme pin (github-pages stack), Gemfile, README.md, the Pages workflow, _config.demo.yml and stubs.
#   repo: where the rendered starter is published; its Pages site is the live demo and "Use this starter" is its
#         /generate link   description: that repository's one-line description
#   languages: first = default, the others in <lang>/ folders   stacks: github-pages (remote_theme, classic builder)
#   and/or jekyll4 (theme gem)   check: modootoday-check flags   showcase: {style: bar | pill} of the demo (bar)
#   qa: pages of the demo build the QA opens (the showcase audit opens the first two)
# demo.docs_url: the theme documentation every demo's showcase links to.
demo:
  docs_url: https://modootoday.github.io/jekyll-theme-modootoday/
starters:
  - name: docs
    repo: modootoday/jekyll-theme-modootoday-docs-starter
    description: A documentation site starter for jekyll-theme-modootoday, in English, Korean and Japanese
    languages: [en, ko, ja]
    stacks: [github-pages, jekyll4]
    check: [--twins, --byte-exact=api]
    showcase: {style: bar}
    qa: ["", guide/, ko/, ja/]
  - name: blog
    repo: modootoday/jekyll-theme-modootoday-blog-starter
    description: A blog starter for jekyll-theme-modootoday, with posts, an author page and a feed
    languages: [en]
    stacks: [github-pages, jekyll4]
    check: [--twins]
    showcase: {style: pill}
    qa: ["", authors/alex/]
  - name: landing
    repo: modootoday/jekyll-theme-modootoday-landing-starter
    description: A product landing page starter for jekyll-theme-modootoday, with pricing and a legal page
    languages: [en]
    stacks: [github-pages, jekyll4]
    check: [--twins]
    showcase: {style: bar}
    qa: ["", pricing/]
